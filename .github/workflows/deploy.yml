name: Deploy to GitHub Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    # Fork PR code must never execute on this persistent self-hosted runner.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.ref == 'refs/heads/main' &&
       (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: [self-hosted, Linux, X64, saasy-landing]
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      # Keep the beta feed until signed stable desktop installers ship (#9807).
      NEXT_PUBLIC_DESKTOP_UPDATE_FEED_URL: https://updates.hellosaasy.ai/beta/latest.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.0"
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/contact-ui/pnpm-lock.yaml
            tests/cookie-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test workflow and existing script guards
        run: node --test scripts/*.test.mjs

      - name: Verify contact UI
        run: |
          pnpm --dir tests/contact-ui install --frozen-lockfile
          pnpm --dir tests/contact-ui test
          pnpm --dir tests/contact-ui typecheck

      - name: Verify cookie UI
        run: |
          pnpm --dir tests/cookie-ui install --frozen-lockfile
          pnpm --dir tests/cookie-ui test
          pnpm --dir tests/cookie-ui typecheck

      - name: Build PR without production credentials
        if: github.event_name == 'pull_request'
        run: pnpm run build

      - name: Build main for deployment
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pnpm run build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}

      - name: Upload artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64, saasy-landing]
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
